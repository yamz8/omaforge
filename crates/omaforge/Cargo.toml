[package]
name = "omaforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
forge-git = { path = "../forge-git" }
forge-ci = { path = "../forge-ci" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
rpassword = "7.5.4"
futures-util = "0.3.34"
serde.workspace = true
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["decompression-gzip", "trace"] }
getrandom = "0.4.3"
russh = "0.64.1"
askama = "0.16.1"
ammonia = "4.2.4"
toml = "1.1.8"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
comrak = { version = "0.57.0", default-features = false }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["form"] }
async-graphql = { version = "7.2.1", default-features = false }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
hmac = "0.13.0"
