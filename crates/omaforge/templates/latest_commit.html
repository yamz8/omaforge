{% if let Some(c) = latest %}
<div class="box-header latest-commit">
  <strong>{{ c.author }}</strong>
  <a class="message" href="{{ c.url }}">{{ c.subject }}</a>
  <a class="sha" href="{{ c.url }}">{{ c.short_id }}</a>
  <span class="muted" title="{{ c.timestamp }}">{{ c.time_ago }}</span>
</div>
{% endif %}
